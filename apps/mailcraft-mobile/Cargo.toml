[package]
name = "mailcraft-mobile-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "MailCraft's phone library: the app core and the network worker pool on a thread of their own, for the Android (JNI) and iOS (C) shells"

# The workspace's lints, but `unsafe` denied rather than forbidden: a library the phone loads
# names its entry points with `#[unsafe(no_mangle)]`, and iOS hands strings over as C pointers.
# Only `src/android.rs` and `src/ios.rs` allow it, each use with its SAFETY: reasoning; every
# other crate keeps `unsafe_code = "forbid"`. As `crates/keys` does (the never-crash rule, CLAUDE.md).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
ignore_without_reason = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[lib]
# `libmailcraftcore.so` on Android, `libmailcraftcore.a` linked into the iOS app; the rlib for
# the tests.
name = "mailcraftcore"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
mailcraft-mobile = { path = "../../crates/mobile" }
mailcraft-engine = { workspace = true }
mailcraft-net = { workspace = true }
crux_core = "0.20"
serde_json = { workspace = true }
log = { workspace = true }

# JNI (MIT OR Apache-2.0): the Kotlin shell's native methods; and the platform verifier's JNI
# side, set up here with the app's context so `net` can ask Android's trust store.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
